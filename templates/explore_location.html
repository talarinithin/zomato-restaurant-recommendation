<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Explore Restaurants - RestoFind</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6B6B;
            --primary-dark: #E55A5A;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #1A1A2E;
            --darker: #16213E;
            --card-bg: rgba(255, 255, 255, 0.08);
            --text: #FFFFFF;
            --text-muted: rgba(255, 255, 255, 0.7);
            --success: #10B981;
            --danger: #EF4444;
            --purple: #A855F7;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1A1A2E 0%, #16213E 50%, #0F3460 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text);
        }

        /* Background Effects */
        .bg-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
        }

        .orb-1 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(255, 107, 107, 0.2), transparent);
            top: -50px;
            left: -80px;
            animation: orbFloat 8s ease-in-out infinite;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(78, 205, 196, 0.15), transparent);
            bottom: 10%;
            right: -80px;
            animation: orbFloat 10s ease-in-out infinite reverse;
        }

        @keyframes orbFloat {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(20px, -20px);
            }
        }

        /* Floating Emojis */
        .floating-emojis {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .float-emoji {
            position: absolute;
            font-size: 1.8em;
            opacity: 0.1;
            animation: floatAround 25s linear infinite;
        }

        .float-emoji:nth-child(1) {
            top: 15%;
            left: 5%;
            animation-delay: 0s;
        }

        .float-emoji:nth-child(2) {
            top: 25%;
            right: 8%;
            animation-delay: 3s;
        }

        .float-emoji:nth-child(3) {
            top: 55%;
            left: 3%;
            animation-delay: 6s;
        }

        .float-emoji:nth-child(4) {
            top: 75%;
            right: 5%;
            animation-delay: 9s;
        }

        .float-emoji:nth-child(5) {
            top: 85%;
            left: 10%;
            animation-delay: 12s;
        }

        @keyframes floatAround {
            0% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-40px) rotate(15deg);
            }

            100% {
                transform: translateY(0) rotate(0deg);
            }
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.6s ease;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .back-btn {
            position: absolute;
            left: 0;
            top: 0;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(-5px);
        }

        .page-title {
            font-size: 2.8em;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .page-subtitle {
            color: var(--text-muted);
            font-size: 1.1em;
        }

        /* Search Card */
        .search-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 40px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2);
            animation: fadeInUp 0.6s ease 0.1s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .search-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .search-icon {
            font-size: 2em;
        }

        .search-title {
            font-size: 1.6em;
            font-weight: 700;
        }

        .search-grid {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 20px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-muted);
            font-size: 0.95em;
        }

        .form-group select {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 16px 20px;
            font-size: 1em;
            color: var(--text);
            transition: all 0.3s ease;
            font-family: inherit;
            cursor: pointer;
        }

        .form-group select:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 4px rgba(78, 205, 196, 0.15);
        }

        .form-group select option {
            background: var(--dark);
            color: var(--text);
        }

        .explore-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 16px 40px;
            border: none;
            border-radius: 14px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .explore-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255, 107, 107, 0.4);
        }

        /* Results Section */
        .results-section {
            display: none;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .results-section.show {
            display: block;
        }

        /* Results Header */
        .results-header {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .location-title-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .location-icon {
            font-size: 2.5em;
        }

        .location-name {
            font-size: 2em;
            font-weight: 800;
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 25px;
            border-radius: 18px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        .stat-box:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
        }

        .stat-icon {
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        .stat-number {
            font-size: 2.2em;
            font-weight: 800;
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
            margin-top: 5px;
        }

        /* Restaurants Section */
        .restaurants-section {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.6em;
            font-weight: 700;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .restaurants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .restaurant-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px;
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .restaurant-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: linear-gradient(180deg, var(--primary), var(--secondary));
        }

        .restaurant-card:hover {
            transform: translateY(-10px) translateX(5px);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        /* Rank-specific styling */
        .restaurant-card.rank-1::before {
            background: linear-gradient(180deg, #FFD700, #FFA500);
        }

        .restaurant-card.rank-2::before {
            background: linear-gradient(180deg, #C0C0C0, #A0A0A0);
        }

        .restaurant-card.rank-3::before {
            background: linear-gradient(180deg, #CD7F32, #8B4513);
        }

        .restaurant-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .restaurant-rank {
            font-size: 2em;
        }

        .restaurant-name {
            font-size: 1.3em;
            font-weight: 700;
            color: var(--text);
            flex: 1;
        }

        .restaurant-type {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .restaurant-type.veg {
            background: rgba(16, 185, 129, 0.2);
            color: #10B981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .restaurant-type.nonveg {
            background: rgba(239, 68, 68, 0.2);
            color: #EF4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .dishes-container {
            background: rgba(255, 255, 255, 0.03);
            padding: 18px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .dishes-label {
            font-size: 0.75em;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dishes-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .dish-tag {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(99, 102, 241, 0.3));
            color: var(--text);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .dish-tag:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.5), rgba(99, 102, 241, 0.5));
        }

        .dish-tag.more {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
        }

        /* Table Section */
        .table-section {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        }

        th {
            padding: 18px 20px;
            text-align: left;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-size: 0.85em;
            color: white;
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
        }

        .type-tag {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .type-tag.veg {
            background: rgba(16, 185, 129, 0.2);
            color: #10B981;
        }

        .type-tag.nonveg {
            background: rgba(239, 68, 68, 0.2);
            color: #EF4444;
        }

        /* Loading & Error */
        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--secondary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: var(--secondary);
            font-weight: 600;
            font-size: 1.1em;
        }

        .error-box {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-left: 4px solid var(--danger);
            padding: 20px;
            border-radius: 14px;
            color: var(--danger);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        /* Responsive */
        @media (max-width: 1000px) {
            .search-grid {
                grid-template-columns: 1fr;
            }

            .explore-btn {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            .page-title {
                font-size: 2em;
            }

            .back-btn {
                position: static;
                margin-bottom: 20px;
            }

            .restaurants-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            th,
            td {
                padding: 12px 15px;
                font-size: 0.9em;
            }
        }
    </style>
</head>

<body>
    <!-- Background Effects -->
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>
    <div class="floating-emojis">
        <span class="float-emoji">🍕</span>
        <span class="float-emoji">🍔</span>
        <span class="float-emoji">🍜</span>
        <span class="float-emoji">🍣</span>
        <span class="float-emoji">🌮</span>
    </div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <a href="/" class="back-btn">← Back to Home</a>
            <h1 class="page-title">🔍 Explore Restaurants</h1>
            <p class="page-subtitle">Discover all restaurants and dishes in your area</p>
        </div>

        <!-- Search Card -->
        <div class="search-card">
            <div class="search-header">
                <span class="search-icon">📍</span>
                <h2 class="search-title">Select a Location</h2>
            </div>
            <div class="search-grid">
                <div class="form-group">
                    <label>Choose Location:</label>
                    <select id="locationSelect" onchange="exploreLocation()">
                        <option value="">-- Select Location --</option>
                    </select>
                </div>
                <button class="explore-btn" onclick="exploreLocation()">
                    <span>🔍</span> Explore
                </button>
            </div>
        </div>

        <!-- Results Section -->
        <div class="results-section" id="resultsSection">
            <!-- Results Header -->
            <div class="results-header">
                <div class="location-title-row">
                    <span class="location-icon">📍</span>
                    <h2 class="location-name" id="selectedLocation"></h2>
                </div>
                <div class="stats-grid" id="statsContainer"></div>
            </div>

            <!-- Error/Loading -->
            <div id="errorContainer"></div>
            <div id="loadingContainer"></div>

            <!-- Restaurants Cards -->
            <div class="restaurants-section" id="restaurantsCardsSection">
                <div class="section-title">
                    <span>🍴</span> All Restaurants
                </div>
                <div class="restaurants-grid" id="restaurantsGrid"></div>
            </div>

            <!-- Data Table -->
            <div class="table-section" id="tableSection">
                <div class="section-title">
                    <span>📋</span> Complete Data
                </div>
                <div class="table-wrapper">
                    <table id="dataTable">
                        <thead>
                            <tr>
                                <th>Restaurant Name</th>
                                <th>Dish</th>
                                <th>Type</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allLocations = [];

        document.addEventListener('DOMContentLoaded', function () {
            loadLocations();
        });

        function loadLocations() {
            fetch('/api/get-locations')
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        allLocations = data.locations;
                        const select = document.getElementById('locationSelect');

                        data.locations.forEach(loc => {
                            const option = document.createElement('option');
                            option.value = loc;
                            option.textContent = loc.charAt(0).toUpperCase() + loc.slice(1);
                            select.appendChild(option);
                        });
                    }
                })
                .catch(err => {
                    console.error('Error:', err);
                    showError('Failed to load locations');
                });
        }

        function exploreLocation() {
            const location = document.getElementById('locationSelect').value;

            if (!location) {
                document.getElementById('resultsSection').classList.remove('show');
                return;
            }

            document.getElementById('resultsSection').classList.add('show');
            document.getElementById('selectedLocation').textContent = location.toUpperCase();

            showLoading();

            fetch('/api/explore-location', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ location: location })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        displayResults(data);
                    } else {
                        showError(data.error || 'Location not found');
                    }
                })
                .catch(err => {
                    console.error('Error:', err);
                    showError('Error fetching location data');
                });
        }

        function displayResults(data) {
            document.getElementById('loadingContainer').innerHTML = '';
            document.getElementById('errorContainer').innerHTML = '';
            document.getElementById('restaurantsCardsSection').style.display = 'block';
            document.getElementById('tableSection').style.display = 'block';

            displayStats(data.stats);
            displayRestaurants(data.restaurants);
            displayTable(data.dishes);
        }

        function displayStats(stats) {
            const statsContainer = document.getElementById('statsContainer');

            statsContainer.innerHTML = `
                <div class="stat-box">
                    <div class="stat-icon">🏪</div>
                    <div class="stat-number">${stats.total_restaurants}</div>
                    <div class="stat-label">Total Restaurants</div>
                </div>
                <div class="stat-box">
                    <div class="stat-icon">🍽️</div>
                    <div class="stat-number">${stats.total_unique_dishes}</div>
                    <div class="stat-label">Unique Dishes</div>
                </div>
                <div class="stat-box">
                    <div class="stat-icon">🥬</div>
                    <div class="stat-number">${stats.veg_restaurants}</div>
                    <div class="stat-label">Veg Options</div>
                </div>
                <div class="stat-box">
                    <div class="stat-icon">🍗</div>
                    <div class="stat-number">${stats.nonveg_restaurants}</div>
                    <div class="stat-label">Non-Veg Options</div>
                </div>
            `;
        }

        function displayRestaurants(restaurants) {
            const grid = document.getElementById('restaurantsGrid');
            let html = '';

            restaurants.forEach((rest, idx) => {
                const rankEmoji = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '⭐';
                const rankClass = idx < 3 ? `rank-${idx + 1}` : '';

                const typeClass = rest.type.toLowerCase().includes('veg') && !rest.type.toLowerCase().includes('non') ? 'veg' : 'nonveg';
                const typeIcon = typeClass === 'veg' ? '🥬' : '🍗';

                html += `
                    <div class="restaurant-card ${rankClass}">
                        <div class="restaurant-header">
                            <span class="restaurant-rank">${rankEmoji}</span>
                            <div class="restaurant-name">${rest.name}</div>
                        </div>
                        <div class="restaurant-type ${typeClass}">
                            ${typeIcon} ${rest.type}
                        </div>
                        <div class="dishes-container">
                            <div class="dishes-label">🍽️ Popular Dishes</div>
                            <div class="dishes-tags">
                                ${rest.dishes.slice(0, 5).map(d =>
                    `<span class="dish-tag">${d}</span>`
                ).join('')}
                                ${rest.dishes.length > 5 ?
                        `<span class="dish-tag more">+${rest.dishes.length - 5} more</span>`
                        : ''}
                            </div>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;
        }

        function displayTable(dishes) {
            const tbody = document.getElementById('tableBody');
            let html = '';

            dishes.forEach(dish => {
                const typeClass = dish.type === 'veg' ? 'veg' : 'nonveg';
                const typeLabel = dish.type === 'veg' ? '🥬 Veg' : '🍗 Non-Veg';

                html += `
                    <tr>
                        <td><strong>${dish.restaurant}</strong></td>
                        <td>${dish.dish}</td>
                        <td><span class="type-tag ${typeClass}">${typeLabel}</span></td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        function showLoading() {
            document.getElementById('loadingContainer').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <div class="loading-text">Exploring location... 🔍</div>
                </div>
            `;
            document.getElementById('restaurantsCardsSection').style.display = 'none';
            document.getElementById('tableSection').style.display = 'none';
        }

        function showError(message) {
            document.getElementById('loadingContainer').innerHTML = '';
            document.getElementById('errorContainer').innerHTML = `
                <div class="error-box">
                    ❌ <strong>Error:</strong> ${message}
                </div>
            `;

            document.getElementById('restaurantsCardsSection').style.display = 'none';
            document.getElementById('tableSection').style.display = 'none';
        }
    </script>
</body>

</html>
