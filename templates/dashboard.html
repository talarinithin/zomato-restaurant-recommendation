<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard - Restaurant Recommendation System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header h1 {
            font-size: 2.5em;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .home-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.4);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .home-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        /* GLASS CARD */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            margin-bottom: 30px;
        }

        .glass-card h2 {
            color: white;
            margin-bottom: 25px;
            font-size: 1.8em;
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }

        /* STATS GRID */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: 700;
            color: #ffd700;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
        }

        /* CHARTS GRID */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .chart-container {
            position: relative;
            height: 400px;
        }

        /* SINGLE COLUMN CHARTS */
        .full-width {
            grid-column: 1 / -1;
        }

        .chart-wrapper {
            position: relative;
            height: 100%;
        }

        /* LOADING STATE */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 400px;
            color: white;
            font-size: 1.2em;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-right: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .glass-card {
                padding: 20px;
            }

            .chart-container {
                height: 300px;
            }
        }

        /* LEGEND STYLING */
        .custom-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9em;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>📊 Analytics Dashboard</h1>
            <a href="/" class="home-btn">← Back to Home</a>
        </div>

        <!-- OVERALL STATS -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalRestaurants">0</div>
                <div class="stat-label">Total Restaurants</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalLocations">0</div>
                <div class="stat-label">Locations</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avgRating">0</div>
                <div class="stat-label">Avg Rating</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalDishes">0</div>
                <div class="stat-label">Unique Dishes</div>
            </div>
        </div>

        <!-- OVERALL ANALYTICS SECTION -->
        <div class="glass-card">
            <h2>📈 Overall Statistics</h2>
            <div class="charts-grid">
                <!-- Restaurants by Location -->
                <div class="glass-card">
                    <div class="chart-container">
                        <canvas id="restaurantsByLocationChart"></canvas>
                    </div>
                </div>

                <!-- Veg vs Non-Veg Distribution -->
                <div class="glass-card">
                    <div class="chart-container">
                        <canvas id="vegNonVegChart"></canvas>
                    </div>
                </div>

                <!-- Rating Distribution -->
                <div class="glass-card full-width">
                    <div class="chart-container">
                        <canvas id="ratingDistributionChart"></canvas>
                    </div>
                </div>

                <!-- Top Restaurants by Rating -->
                <div class="glass-card full-width">
                    <div class="chart-container">
                        <canvas id="topRestaurantsChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- USER SEARCH PATTERNS SECTION -->
        <div class="glass-card">
            <h2>👥 User Search Patterns</h2>
            <div class="charts-grid">
                <!-- Most Searched Locations -->
                <div class="glass-card">
                    <div class="chart-container">
                        <canvas id="searchedLocationsChart"></canvas>
                    </div>
                </div>

                <!-- Most Searched Dishes -->
                <div class="glass-card">
                    <div class="chart-container">
                        <canvas id="searchedDishesChart"></canvas>
                    </div>
                </div>

                <!-- Success Rate Distribution -->
                <div class="glass-card full-width">
                    <div class="chart-container">
                        <canvas id="successRateChart"></canvas>
                    </div>
                </div>

                <!-- Cost vs Rating Correlation -->
                <div class="glass-card full-width">
                    <div class="chart-container">
                        <canvas id="costRatingChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- DISTANCE ANALYSIS -->
        <div class="glass-card">
            <h2>📍 Distance Analysis</h2>
            <div class="charts-grid">
                <div class="glass-card full-width">
                    <div class="chart-container">
                        <canvas id="distanceChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let charts = {};

        // Chart colors
        const colors = {
            primary: '#667eea',
            secondary: '#764ba2',
            accent: '#f093fb',
            gold: '#ffd700',
            green: '#4caf50',
            red: '#f44336',
            blue: '#2196f3',
            orange: '#ff9800'
        };

        const chartColors = [
            '#667eea', '#764ba2', '#f093fb', '#ffd700',
            '#4caf50', '#f44336', '#2196f3', '#ff9800',
            '#9c27b0', '#00bcd4', '#ff5722', '#795548'
        ];

        document.addEventListener('DOMContentLoaded', function() {
            loadDashboardData();
        });

        function loadDashboardData() {
            fetch('/api/dashboard-analytics')
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        updateStats(data.stats);
                        createCharts(data.analytics);
                    }
                })
                .catch(err => {
                    console.error('Error loading dashboard data:', err);
                });
        }

        function updateStats(stats) {
            document.getElementById('totalRestaurants').textContent = stats.total_restaurants;
            document.getElementById('totalLocations').textContent = stats.total_locations;
            document.getElementById('avgRating').textContent = stats.avg_rating.toFixed(2);
            document.getElementById('totalDishes').textContent = stats.total_dishes;
        }

        function createCharts(data) {
            // 1. Restaurants by Location (Horizontal Bar)
            createRestaurantsByLocationChart(data.restaurants_by_location);

            // 2. Veg vs Non-Veg (Pie)
            createVegNonVegChart(data.veg_nonveg_distribution);

            // 3. Rating Distribution (Histogram)
            createRatingDistributionChart(data.rating_distribution);

            // 4. Top Restaurants (Bar)
            createTopRestaurantsChart(data.top_restaurants);

            // 5. Most Searched Locations (Bar)
            createSearchedLocationsChart(data.popular_locations);

            // 6. Most Searched Dishes (Bar)
            createSearchedDishesChart(data.popular_dishes);

            // 7. Success Rate Distribution (Line)
            createSuccessRateChart(data.success_rate_distribution);

            // 8. Cost vs Rating (Scatter)
            createCostRatingChart(data.cost_rating_data);

            // 9. Distance Analysis (Area)
            createDistanceChart(data.distance_distribution);
        }

        function createRestaurantsByLocationChart(data) {
            const ctx = document.getElementById('restaurantsByLocationChart').getContext('2d');
            charts.locationChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(d => d.location),
                    datasets: [{
                        label: 'Number of Restaurants',
                        data: data.map(d => d.count),
                        backgroundColor: chartColors,
                        borderColor: 'rgba(255, 255, 255, 0.3)',
                        borderWidth: 2
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: 'rgba(255, 255, 255, 0.8)' } },
                        title: { display: false }
                    },
                    scales: {
                        x: { ticks: { color: 'rgba(255, 255, 255, 0.6)' }, grid: { color: 'rgba(255, 255, 255, 0.1)' } },
                        y: { ticks: { color: 'rgba(255, 255, 255, 0.6)' }, grid: { display: false } }
                    }
                }
            });
        }

        function createVegNonVegChart(data) {
            const ctx = document.getElementById('vegNonVegChart').getContext('2d');
            charts.vegChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(data),
                    datasets: [{
                        data: Object.values(data),
                        backgroundColor: ['#4caf50', '#f44336', '#2196f3'],
                        borderColor: 'rgba(255, 255, 255, 0.3)',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: 'rgba(255, 255, 255, 0.8)' },
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        function createRatingDistributionChart(data) {
            const ctx = document.getElementById('ratingDistributionChart').getContext('2d');
            charts.ratingChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(d => d.rating.toFixed(1)),
                    datasets: [{
                        label: 'Number of Restaurants',
                        data: data.map(d => d.count),
                        backgroundColor: '#667eea',
                        borderColor: 'rgba(255, 255, 255, 0.3)',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: 'rgba(255, 255, 255, 0.8)' } }
                    },
                    scales: {
                        y: { ticks: { color: 'rgba(255, 255, 255, 0.6)' }, grid: { color: 'rgba(255, 255, 255, 0.1)' } },
                        x: { ticks: { color: 'rgba(255, 255, 255, 0.6)' }, grid: { display: false } }
                    }
                }
            });
        }

        function createTopRestaurantsChart(data) {
            const ctx = document.getElementById('topRestaurantsChart').getContext('2d');
            charts.topRestaurants = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(d => d.name),
                    datasets: [{
                        label: 'Rating',
                        data: data.map(d => d.rating),
                        backgroundColor: '#ffd700',
                        borderColor: 'rgba(255, 255, 255, 0.3)',
                        borderWidth: 2
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: 'rgba(255, 255, 255, 0.8)' } }
                    },
                    scales: {
                        x: { ticks: { color: 'rgba(255, 255, 255, 0.6)' }, grid: { color: 'rgba(255, 255, 255, 0.1)' } },
                        y: { ticks: { color: 'rgba(255, 255, 255, 0.6)' }, grid: { display: false } }
                    }
                }
            });
        }

        function createSearchedLocationsChart(data) {
            const ctx = document.getElementById('searchedLocationsChart').getContext('2d');
            charts.searchedLoc = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(d => d.location),
                    datasets: [{
                        label: 'Search Count',
                        data: data.map(d => d.count),
                        backgroundColor: '#764ba2',
                        borderColor: 'rgba(255, 255, 255, 0.3)',
                        borderWidth: 2
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: 'rgba(255, 255, 255, 0.8)' } }
                    },
                    scales: {
                        x: { ticks: { color: 'rgba(255, 255, 255, 0.6)' }, grid: { color: 'rgba(255, 255, 255, 0.1)' } },
                        y: { ticks: { color: 'rgba(255, 255, 255, 0.6)' }, grid: { display: false } }
                    }
                }
            });
        }

        function createSearchedDishesChart(data) {
            const ctx = document.getElementById('searchedDishesChart').getContext('2d');
            charts.searchedDish = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(d => d.dish),
                    datasets: [{
                        label: 'Search Count',
                        data: data.map(d => d.count),
                        backgroundColor: '#f093fb',
                        borderColor: 'rgba(255, 255, 255, 0.3)',
                        borderWidth: 2
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: 'rgba(255, 255, 255, 0.8)' } }
                    },
                    scales: {
                        x: { ticks: { color: 'rgba(255, 255, 255, 0.6)' }, grid: { color: 'rgba(255, 255, 255, 0.1)' } },
                        y: { ticks: { color: 'rgba(255, 255, 255, 0.6)' }, grid: { display: false } }
                    }
                }
            });
        }

        function createSuccessRateChart(data) {
            const ctx = document.getElementById('successRateChart').getContext('2d');
            charts.successRate = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => d.range),
                    datasets: [{
                        label: 'Number of Restaurants',
                        data: data.map(d => d.count),
                        borderColor: '#4caf50',
                        backgroundColor: 'rgba(76, 175, 80, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: 'rgba(255, 255, 255, 0.8)' } }
                    },
                    scales: {
                        y: { ticks: { color: 'rgba(255, 255, 255, 0.6)' }, grid: { color: 'rgba(255, 255, 255, 0.1)' } },
                        x: { ticks: { color: 'rgba(255, 255, 255, 0.6)' }, grid: { color: 'rgba(255, 255, 255, 0.1)' } }
                    }
                }
            });
        }

        function createCostRatingChart(data) {
            const ctx = document.getElementById('costRatingChart').getContext('2d');
            charts.costRating = new Chart(ctx, {
                type: 'bubble',
                data: {
                    datasets: [{
                        label: 'Restaurants',
                        data: data.map(d => ({
                            x: d.cost,
                            y: d.rating,
                            r: 8
                        })),
                        backgroundColor: 'rgba(102, 126, 234, 0.6)',
                        borderColor: 'rgba(255, 255, 255, 0.3)',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: 'rgba(255, 255, 255, 0.8)' } }
                    },
                    scales: {
                        y: {
                            title: { display: true, text: 'Rating', color: 'rgba(255, 255, 255, 0.8)' },
                            ticks: { color: 'rgba(255, 255, 255, 0.6)' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        },
                        x: {
                            title: { display: true, text: 'Cost (₹)', color: 'rgba(255, 255, 255, 0.8)' },
                            ticks: { color: 'rgba(255, 255, 255, 0.6)' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        }
                    }
                }
            });
        }

        function createDistanceChart(data) {
            const ctx = document.getElementById('distanceChart').getContext('2d');
            charts.distance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => d.range),
                    datasets: [{
                        label: 'Number of Restaurants',
                        data: data.map(d => d.count),
                        borderColor: '#2196f3',
                        backgroundColor: 'rgba(33, 150, 243, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: 'rgba(255, 255, 255, 0.8)' } }
                    },
                    scales: {
                        y: { ticks: { color: 'rgba(255, 255, 255, 0.6)' }, grid: { color: 'rgba(255, 255, 255, 0.1)' } },
                        x: { ticks: { color: 'rgba(255, 255, 255, 0.6)' }, grid: { color: 'rgba(255, 255, 255, 0.1)' } }
                    }
                }
            });
        }
    </script>
</body>
</html>
